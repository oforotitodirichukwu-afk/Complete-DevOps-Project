name: Complete DevOps Project Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Short SHA
        run: |
          echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t princep260471/complete-devops-project:${{ env.SHORT_SHA }} .

      - name: Push to Docker Hub
        run: |
          docker push princep260471/complete-devops-project:${{ env.SHORT_SHA }}
      - name: Configure Git Author
        run: |
          git config --global user.email "oforpraisetibess@gmail.com"
            git config --global user.name "oforotitodirichukwu-afk"
      - name: Update Helm Chart with new image tage
        run: |
          sed -i "s/tag:.*/tag: ${{ env.SHORT_SHA }}/" ./complete-devops-project-time-printer/values.yaml
          git add ./complete-devops-project-time-printer/values.yaml
          git commit -m "Update image tag ${{ env.SHORT_SHA }}"
          git push origin main